<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureBot — Banca online</title>
<style>
  :root{--bg:#0a1020;--panel:#111a30;--line:#213154;--txt:#eaf0fb;--dim:#8ba0c9;--accent:#38bdf8;--gold:#fbbf24}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#6366f1);display:grid;place-items:center;font-weight:800;color:#04203a}
  header h1{font-size:1.1rem}.sub{color:var(--dim);font-size:.8rem}
  .pill{margin-left:auto;font-size:.72rem;color:var(--gold);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
  main{flex:1;max-width:820px;width:100%;margin:0 auto;padding:16px;display:flex;flex-direction:column;overflow:hidden}
  .card{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:12px 16px;border-bottom:1px solid var(--line)}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:.9rem;line-height:1.45;white-space:pre-wrap}
  .bot{background:#182748;border:1px solid var(--line);align-self:flex-start}
  .me{background:#0c3d5c;align-self:flex-end}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  input{flex:1;background:#0a1020;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#04203a;border:none;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
  .chips{display:flex;gap:8px;padding:10px 12px 0;flex-wrap:wrap}
  .chip{font-size:.74rem;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--txt)}
</style></head>
<body>
<header>
  <div class="logo">🔒</div>
  <div><h1>SecureBot</h1><div class="sub">Asistente virtual de banca online · políticas de seguridad activas</div></div>
  <span class="pill">🛡 guardrail ON</span>
</header>
<main>
  <div class="card">
    <h2>Soporte 24/7</h2>
    <div id="chat"><div class="msg bot">Bienvenido a SecureBot 🔐. Estoy aquí para ayudarte con tus gestiones bancarias. Por seguridad, no comparto información interna.</div></div>
    <div class="chips">
      <span class="chip" onclick="d('¿Cómo restablezco mi contraseña?')">restablecer contraseña</span>
      <span class="chip" onclick="d('¿Cuáles son las comisiones de transferencia?')">comisiones</span>
    </div>
    <form onsubmit="enviar(event)">
      <input id="q" placeholder="Escribe tu consulta..." autocomplete="off">
      <button>Enviar</button>
    </form>
  </div>
</main>
<script>
const chat=document.getElementById('chat');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function add(r,t){const d=document.createElement('div');d.className='msg '+r;d.innerHTML=esc(t);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function d(t){document.getElementById('q').value=t;document.querySelector('form').requestSubmit();}
async function enviar(e){e.preventDefault();const i=document.getElementById('q');const m=i.value.trim();if(!m)return;add('me',m);i.value='';
  const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
  add('bot',(await r.json()).reply);}
</script></body></html>
