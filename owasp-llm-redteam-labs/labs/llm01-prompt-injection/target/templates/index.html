<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorpAssistant — Portal de Soporte</title>
<style>
  :root{--bg:#0f1720;--panel:#16212e;--line:#243447;--txt:#e6edf3;--dim:#8ca0b3;--accent:#2dd4bf;--warn:#f59e0b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#3b82f6);display:grid;place-items:center;font-weight:800;color:#04231f}
  header h1{font-size:1.1rem}.sub{color:var(--dim);font-size:.8rem}
  .badge{margin-left:auto;font-size:.7rem;color:var(--dim);border:1px solid var(--line);padding:4px 9px;border-radius:20px}
  main{flex:1;display:grid;grid-template-columns:1fr 320px;gap:16px;padding:16px;overflow:hidden}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:12px 16px;border-bottom:1px solid var(--line)}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:82%;padding:10px 13px;border-radius:12px;font-size:.9rem;line-height:1.45;white-space:pre-wrap}
  .bot{background:#1e2c3a;border:1px solid var(--line);align-self:flex-start}
  .me{background:#0d4f47;align-self:flex-end}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  input,textarea{flex:1;background:#0d1620;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-family:inherit;font-size:.9rem;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#04231f;border:none;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-family:inherit}
  button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  #paginas{padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .pagina{padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:.85rem}
  .pagina:hover{border-color:var(--accent);background:#0d1620}
</style></head>
<body>
<header>
  <div class="logo">CA</div>
  <div><h1>CorpAssistant</h1><div class="sub">Portal interno de soporte · v2.4</div></div>
  <span class="badge">🔒 sesión de empleado</span>
</header>
<main>
  <section class="card">
    <h2>Chat de soporte</h2>
    <div id="chat"><div class="msg bot">Hola 👋 Soy CorpAssistant. Puedo responder dudas internas y resumir páginas web.</div></div>
    <form onsubmit="enviar(event)">
      <input id="q" placeholder="Escribe tu consulta..." autocomplete="off">
      <button>Enviar</button>
    </form>
  </section>
  <aside class="card">
    <h2>Resumir fuente web</h2>
    <div id="paginas"></div>
  </aside>
</main>
<script>
const chat=document.getElementById('chat');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function add(role,txt){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=esc(txt);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
async function enviar(e){e.preventDefault();const i=document.getElementById('q');const m=i.value.trim();if(!m)return;add('me',m);i.value='';
  const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
  add('bot',(await r.json()).reply);}
async function cargarPaginas(){const r=await fetch('/paginas');const d=await r.json();const box=document.getElementById('paginas');box.innerHTML='';
  (d.paginas_disponibles||[]).forEach(p=>{const el=document.createElement('div');el.className='pagina';el.textContent='🌐 '+p;el.onclick=()=>resumir(p);box.appendChild(el);});}
async function resumir(p){add('me','[resumir] '+p);
  const r=await fetch('/resumir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pagina:p})});
  add('bot',(await r.json()).reply);}
cargarPaginas();
</script></body></html>
