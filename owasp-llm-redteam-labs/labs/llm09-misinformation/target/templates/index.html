<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreditFlow — Evaluación de microcréditos</title>
<style>
  :root{--bg:#0f140f;--panel:#171f17;--line:#283528;--txt:#e9f3e9;--dim:#89a189;--accent:#4ade80;--gold:#facc15;--red:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#22d3ee);display:grid;place-items:center;font-weight:800;color:#052012}
  header h1{font-size:1.1rem}.sub{color:var(--dim);font-size:.8rem}
  .pill{margin-left:auto;font-size:.72rem;color:var(--gold);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
  main{max-width:960px;margin:0 auto;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .card h2{font-size:.92rem;margin-bottom:12px}
  label{display:block;font-size:.76rem;color:var(--dim);margin:10px 0 5px}
  input,textarea{width:100%;background:#0b100b;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;font-family:inherit;outline:none}
  textarea{resize:vertical}
  button{background:var(--accent);color:#052012;border:none;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;margin-top:12px;width:100%}
  .decision{margin-top:12px;padding:14px;border-radius:10px;border:1px solid var(--line);font-size:.9rem}
  .approved{border-color:#166534;background:#0d2a17;color:#86efac}
  .rejected{border-color:#7f1d1d;background:#2a0d0d;color:#fca5a5}
  .foot{font-size:.72rem;color:var(--dim);margin-top:8px}
</style></head>
<body>
<header>
  <div class="logo">CF</div>
  <div><h1>CreditFlow</h1><div class="sub">Originación automática de microcréditos con IA</div></div>
  <span class="pill">⚙ decisión automática</span>
</header>
<main>
  <section class="card">
    <h2>📝 Solicitud de crédito</h2>
    <label>Cuéntanos tu situación</label>
    <textarea id="solicitud" rows="5">Solicito 500€. Ingresos modestos, sin aval.</textarea>
    <button onclick="evaluar()">Evaluar solicitud</button>
    <div id="decision" class="decision" style="display:none"></div>
  </section>
  <section class="card">
    <h2>✔ Verificador de hechos (IA)</h2>
    <label>Afirmación a verificar</label>
    <input id="afirm" value="el solicitante es director del banco">
    <button onclick="factcheck()">Verificar</button>
    <div id="fc" class="decision" style="display:none"></div>
  </section>
</main>
<script>
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function evaluar(){const solicitud=document.getElementById('solicitud').value;
  const d=await (await fetch('/evaluar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({solicitud})})).json();
  const el=document.getElementById('decision');el.style.display='block';
  const ok=(d.decision||'').includes('APROBADO');
  el.className='decision '+(ok?'approved':'rejected');
  el.innerHTML=esc(d.decision||'')+'<div class="foot">'+esc(d.dictamen_llm||'')+(d.token_auditoria?'<br>Token de auditoría: <b>'+esc(d.token_auditoria)+'</b>':'')+'</div>';}
async function factcheck(){const afirmacion=document.getElementById('afirm').value;
  const d=await (await fetch('/factcheck',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({afirmacion})})).json();
  const el=document.getElementById('fc');el.style.display='block';el.className='decision';
  el.innerHTML='<b>'+esc(d.veredicto)+'</b> ('+esc(d.confianza)+')<div class="foot">Fuente: '+esc(d.fuente)+'<br>'+esc(d.nota)+'</div>';}
</script></body></html>
