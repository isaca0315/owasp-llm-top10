<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PluginHub — Registro de artefactos ML</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--accent:#3fb950;--amber:#d29922}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#58a6ff);display:grid;place-items:center;font-weight:800;color:#04220f}
  header h1{font-size:1.1rem}.sub{color:var(--dim);font-size:.8rem}
  .badge{margin-left:auto;font-size:.72rem;color:var(--amber);border:1px solid var(--line);padding:4px 10px;border-radius:20px}
  main{max-width:1000px;margin:0 auto;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .card h2{font-size:.95rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:.78rem;color:var(--dim);margin:10px 0 5px}
  input[type=text],input[type=file]{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px}
  button{background:var(--accent);color:#04220f;border:none;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;margin-top:12px;width:100%}
  button.alt{background:#21262d;color:var(--txt);border:1px solid var(--line)}
  pre{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.78rem;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-top:10px;max-height:220px}
  ul{list-style:none;font-size:.85rem}
  li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-family:ui-monospace,monospace}
  .muted{color:var(--dim);font-size:.78rem}
</style></head>
<body>
<header>
  <div class="logo">⬡</div>
  <div><h1>PluginHub</h1><div class="sub">Registro interno de plugins y modelos del pipeline LLM</div></div>
  <span class="badge">⚠ registry sin firma</span>
</header>
<main>
  <section class="card">
    <h2>📦 Artefactos publicados</h2>
    <ul id="lista"><li class="muted">cargando…</li></ul>
    <button class="alt" onclick="listar()">↻ Refrescar</button>

    <h2 style="margin-top:22px">⬆ Publicar artefacto</h2>
    <label>Nombre del artefacto</label>
    <input type="text" id="upname" value="modelo_v2.pkl">
    <label>Archivo del modelo/plugin</label>
    <input type="file" id="upfile">
    <button onclick="subir()">Publicar en registry</button>
  </section>

  <section class="card">
    <h2>🔧 Cargar / inspeccionar</h2>
    <label>Nombre del artefacto a cargar</label>
    <input type="text" id="loadname" value="modelo_v2.pkl">
    <button onclick="cargar()">Cargar artefacto</button>

    <label style="margin-top:16px">Ver archivo generado</label>
    <input type="text" id="fname" value="exfil.txt">
    <button class="alt" onclick="verArchivo()">Abrir archivo</button>

    <pre id="out">Esperando acción…</pre>
  </section>
</main>
<script>
const out=document.getElementById('out');
function show(o){out.textContent=typeof o==='string'?o:JSON.stringify(o,null,2);}
async function listar(){const r=await fetch('/plugins');const d=await r.json();
  document.getElementById('lista').innerHTML=(d.artefactos||[]).map(a=>'<li>'+a+'</li>').join('')||'<li class="muted">vacío</li>';}
async function subir(){const f=document.getElementById('upfile').files[0];const n=document.getElementById('upname').value;
  if(!f){show('Selecciona un archivo');return;}
  const r=await fetch('/plugins/upload?name='+encodeURIComponent(n),{method:'POST',body:f});
  show(await r.json());listar();}
async function cargar(){const n=document.getElementById('loadname').value;
  const r=await fetch('/plugins/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
  show(await r.json());}
async function verArchivo(){const n=document.getElementById('fname').value;
  const r=await fetch('/plugins/files?name='+encodeURIComponent(n));show(await r.json());}
listar();
</script></body></html>
