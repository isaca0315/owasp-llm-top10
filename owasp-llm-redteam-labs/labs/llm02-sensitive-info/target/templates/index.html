<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeopleHub — Asistente de RRHH</title>
<style>
  :root{--bg:#111318;--panel:#1a1d24;--line:#2b303b;--txt:#eceef2;--dim:#8b93a3;--accent:#818cf8;--pink:#f472b6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;font-weight:800;color:#1b1030}
  header h1{font-size:1.1rem}.sub{color:var(--dim);font-size:.8rem}
  .user{margin-left:auto;font-size:.8rem;color:var(--dim)}
  main{flex:1;display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px;overflow:hidden}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .card h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:84%;padding:10px 13px;border-radius:12px;font-size:.88rem;line-height:1.45;white-space:pre-wrap}
  .bot{background:#222634;border:1px solid var(--line);align-self:flex-start}
  .me{background:#3b2f6b;align-self:flex-end}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  input{flex:1;background:#0e1015;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#1b1030;border:none;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);width:100%;margin-top:10px}
  .side{padding:14px;font-size:.82rem;color:var(--dim);line-height:1.5}
  .stat{background:#0e1015;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
  .stat b{color:var(--txt)}
</style></head>
<body>
<header>
  <div class="logo">PH</div>
  <div><h1>PeopleHub</h1><div class="sub">Asistente inteligente de Recursos Humanos</div></div>
  <span class="user">👤 anav@empresa.example · RRHH</span>
</header>
<main>
  <section class="card">
    <h2><span>Asistente RRHH</span></h2>
    <div id="chat"><div class="msg bot">Hola, soy tu asistente de RRHH. Puedo ayudarte con consultas sobre el personal.</div></div>
    <form onsubmit="enviar(event)">
      <input id="q" placeholder="Pregunta sobre empleados, políticas, datos..." autocomplete="off">
      <button>Preguntar</button>
    </form>
  </section>
  <aside class="card">
    <h2>Panel de datos</h2>
    <div class="side">
      <div class="stat">Empleados en plantilla: <b>128</b></div>
      <div class="stat">Registros sincronizados: <b>hoy 03:00</b></div>
      <div class="stat">Fuente: <b>HR-DataWarehouse</b></div>
      <button class="ghost" onclick="exportar()">⬇ Exportar informe de plantilla</button>
      <pre id="exp" style="margin-top:10px;white-space:pre-wrap;word-break:break-word;color:#f472b6;font-size:.72rem"></pre>
    </div>
  </aside>
</main>
<script>
const chat=document.getElementById('chat');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function add(r,t){const d=document.createElement('div');d.className='msg '+r;d.innerHTML=esc(t);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
async function enviar(e){e.preventDefault();const i=document.getElementById('q');const m=i.value.trim();if(!m)return;add('me',m);i.value='';
  const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
  add('bot',(await r.json()).reply);}
async function exportar(){const r=await fetch('/exportar',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  document.getElementById('exp').textContent=(await r.text()).slice(0,1500);}
</script></body></html>
